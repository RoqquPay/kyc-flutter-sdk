name: kyc_engine
description: "A headless, camera-based face liveness verification engine for Flutter. Provides face detection, anti-spoofing, and configurable liveness challenges."
version: 0.1.0
repository: https://github.com/RoqquPay/kyc-flutter-sdk

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera and image processing
  camera: ^0.11.0+2
  image: ^4.3.0

  # ML Kit face detection
  google_mlkit_face_detection: ^0.13.2

  # TensorFlow Lite for anti-spoofing
  tflite_flutter: ^0.11.0

  # File handling
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utils
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/ml_models/anti_spoof.tflite
