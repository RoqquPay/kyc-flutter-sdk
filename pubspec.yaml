name: roqqu_kyc
description: "A headless, reusable KYC SDK for Flutter applications with face detection, liveness checking, and anti-spoofing capabilities."
version: 0.0.1
publish_to: none
homepage: https://roqqu.com

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Camera and image processing
  camera: ^0.11.0+2
  image: ^4.3.0
  
  # ML Kit for face detection

  
  # TensorFlow Lite for anti-spoofing
  tflite_flutter: ^0.11.0
  
  # HTTP client (for sample API client)
  dio: ^5.4.0
  
  # File handling
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # Utils
  equatable: ^2.0.7
  meta: ^1.15.0
  google_mlkit_face_detection: ^0.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/ml_models/anti_spoof.tflite
